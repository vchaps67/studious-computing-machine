name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate notebook format
        run: |
          pip install --quiet nbformat
          python -c "import nbformat,glob; [nbformat.validate(nbformat.read(f, as_version=4)) or print('ok', f) for f in glob.glob('**/*.ipynb', recursive=True)]"
